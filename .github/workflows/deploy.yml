# Publica en Firebase Hosting cada vez que se mergea a main.
# Por ahora solo hosting; en la fase 1 se suman reglas e índices y los tests (ver docs/PLAN.md).
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: produccion
    permissions:
      contents: read
    env:
      FIREBASE_DEPLOY_KEY: ${{ secrets.FIREBASE_DEPLOY_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Avisar si falta la credencial de deploy
        if: ${{ env.FIREBASE_DEPLOY_KEY == '' }}
        run: echo "::warning::Falta el secret FIREBASE_DEPLOY_KEY en el environment produccion. No se publica."

      - name: Autenticar en Google
        if: ${{ env.FIREBASE_DEPLOY_KEY != '' }}
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_DEPLOY_KEY }}

      - name: Publicar
        if: ${{ env.FIREBASE_DEPLOY_KEY != '' }}
        run: npx --yes firebase-tools@15.36.0 deploy --only hosting --project mi-vehiculo-mantenimiento
